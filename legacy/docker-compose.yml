# LEGADO — protótipo arquivado. Contém defaults inseguros apenas para dev local.
# NUNCA usar com dados reais. Ver docs/product-engineering-assessment.md §2.
#
# Projeto isolado: psicoapp-legacy. Reutiliza o volume original
# psicoapp_db_data (PostgreSQL 15) — dados do protótipo preservados.
# Portas: db em 127.0.0.1:5433 (5432 pertence ao ambiente novo).
name: psicoapp-legacy

services:
  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-psico}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-psico123}
      POSTGRES_DB: ${POSTGRES_DB:-psicoapp}
      TZ: America/Sao_Paulo
    volumes:
      - db_data:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    ports:
      - "127.0.0.1:5433:5432"

  backend:
    build: ./backend
    ports:
      - "127.0.0.1:3001:3001"
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgres://psico:psico123@db:5432/psicoapp}
      JWT_SECRET: ${JWT_SECRET:-prototype-secret-dev-only}
      TZ: America/Sao_Paulo
    depends_on:
      - db
    volumes:
      - ./backend:/app
      - /app/node_modules

  frontend:
    build: ./frontend
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      VITE_API_URL: /api
    depends_on:
      - backend
    volumes:
      - ./frontend:/app
      - /app/node_modules

volumes:
  db_data:
    name: psicoapp_db_data
